<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layered — You're in.</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --plum-deep:  #2D0A1F;
      --plum-mid:   #5C1A3A;
      --mauve:      #9C6B7A;
      --gold:       #C9A24D;
      --rose-gold:  #C49A8A;
      --blush:      #E8C4C0;
      --nude:       #F5EDE4;
      --champagne:  #C8A8B0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--plum-deep);
      color: var(--nude);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      letter-spacing: 0.04em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      padding: 26px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-logo { width: 160px; opacity: 0.9; flex-shrink: 0; }
    .nav-link {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--nude);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .nav-link:hover { opacity: 1; }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    main::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% 40%, rgba(92,26,58,0.52) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 75% 70%, rgba(156,107,122,0.09) 0%, transparent 60%),
        radial-gradient(ellipse 35% 25% at 20% 75%, rgba(201,162,77,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    main::after {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(92,26,58,0.16) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: breathe 9s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
      50%       { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    }

    .confirmation-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 1.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--champagne);
      opacity: 0.5;
      margin-bottom: 44px;
    }
    .divider {
      width: 1px; height: 52px;
      background: linear-gradient(to bottom, transparent, rgba(200,168,176,0.5), transparent);
      margin: 0 auto 44px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--nude);
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin-bottom: 28px;
    }
    .sub {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: var(--champagne);
      opacity: 0.55;
      line-height: 1.9;
      max-width: 380px;
      margin-bottom: 52px;
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      color: var(--nude);
      opacity: 0.6;
      letter-spacing: 0.03em;
    }

    /* ── FOOTER (exact match to index.html) ── */
    footer {
      padding: 52px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border-top: 1px solid rgba(200,168,176,0.08);
      flex-shrink: 0;
    }
    .footer-logo { width: 80px; opacity: 0.35; flex-shrink: 0; }
    .footer-right { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .footer-social {
      color: var(--champagne); opacity: 0.45; text-decoration: none;
      transition: opacity 0.3s; display: flex; align-items: center;
    }
    .footer-social:hover { opacity: 0.9; }
    .footer-copy { font-size: 10px; letter-spacing: 0.1em; color: var(--champagne); opacity: 0.2; }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      nav { padding: 20px 24px; }
      .nav-logo { width: 120px; }
      footer { padding: 36px 24px; gap: 12px; }
      .footer-logo { width: 100px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
